backend:
  name: github
  repo: liquid1188/dc-social-collective
  branch: main

# Used for the "View on site" links next to an event or an album.
site_url: https://liquid1188.github.io/dc-social-collective

media_folder: src/images/events
public_folder: /images/events

# Every picture you upload, anywhere in this editor, is shrunk to 2048 pixels on
# its longest side and saved as WebP before it leaves your browser. Files larger
# than 25 MB are refused.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048
      svg:
        optimize: true
  default:
    config:
      max_file_size: 26214400
      slugify_filename: true

collections:
  - name: events
    label: Events
    label_singular: Event
    description: "Press Add to announce a night. When the date passes it moves to Past nights on its own."
    folder: src/events
    create: true
    slug: "{{fields.date}}-{{slug}}"
    preview_path: "/events/{{slug}}/"
    summary: "{{date}} · {{title}} · {{venue}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Event name, hint: "The name people will see, for example Sangria y Salsa." }
      - { name: date, label: Date of the night, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", default: "{{now}}", hint: "Once this date is past, the night moves itself down to Past nights." }
      - { name: time, label: Start time, hint: "Write it the way you would say it, for example 7:30 pm." }
      - { name: end, label: End time, required: false, hint: "Optional, for example 11 pm." }
      - { name: venue, label: Venue, hint: "The place, for example Whiffletree Farm." }
      - { name: address, label: Address, required: false, hint: "Optional. Street, city, state, and zip. This is what the Open in Maps link uses." }
      - { name: series, label: Series, widget: select, options: ["Sangria y Salsa", "Country Nights", "Balls and galas", "Soirees and mixers", "Special events"], default: "Special events", hint: "Which kind of night this is. It groups the event with the others like it." }
      - { name: image, label: Cover image, widget: image, hint: "The wide event graphic, about 1500 by 750 pixels. It is resized and saved as WebP for you." }
      - { name: tickets, label: Ticket link, required: false, hint: "Paste the RSVPify link. Clear it once the night is over and the page stops asking for tickets." }
      - { name: body, label: Description, widget: markdown, hint: "A few short paragraphs. Leave a blank line between them." }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "On keeps the night off the site while you finish it. Turn it off to publish. Nights that arrive from RSVPify start as drafts." }
      - { name: tags, widget: hidden, default: event }

  - name: albums
    label: Photo albums
    label_singular: Album
    description: "Press Add, type the name of the night and its date, drop all the photos into the one box, and save. Each album gets its own folder with its photos inside it."
    folder: src/albums
    create: true
    path: "{{fields.date}}-{{slug}}/index"
    extension: md
    format: yaml-frontmatter
    media_folder: ""
    public_folder: ""
    preview_path: "/photos/{{dirname}}/"
    summary: "{{fields.date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Album name, hint: "The name of the night, for example Sangria y Salsa." }
      - { name: date, label: Date of the night, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", default: "{{now}}", hint: "The album folder is named after this date, so set it before you save." }
      - { name: photos, label: Photos, widget: image, multiple: true, hint: "Drop the whole night in here at once. Drag a photo to move it. The first one is used on the Photos page unless you set a cover below." }
      - { name: cover, label: Cover photo, widget: image, required: false, hint: "Optional. The one photo shown on the Photos page. Leave it empty to use the first photo." }
      - { name: downloadUrl, label: Link to the originals, required: false, hint: "Optional. Paste the share link to this night's folder in Google Drive and a Download the originals button appears on the album. Set the folder to Anyone with the link can view." }
      - { name: source, label: Imported from, widget: hidden, required: false }

  - name: pages
    label: Page text
    description: "The words on the homepage and About page. Made a mistake? Open Site history (yoursite/admin/history/) to restore any earlier version, or text Andrew."
    files:
      - name: home
        label: Homepage
        file: src/_data/home.json
        fields:
          - name: hero
            label: Top of page
            widget: object
            fields:
              - { name: headline, label: Headline }
              - { name: emphasis, label: Words in the headline to set in italics, hint: "Must match part of the headline exactly." }
              - { name: lede, label: Paragraph under the headline, widget: text }
              - { name: primary, label: Main button }
              - { name: secondary, label: Second button }
          - name: story
            label: Our story block
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: lede, label: First paragraph, widget: text }
              - { name: body, label: Second paragraph, widget: text }
      - name: quotes
        label: Quotes on the homepage
        file: src/_data/quotes.json
        description: "The three pull quotes under the homepage photos. Only use words someone actually said, and say where they said them. If a quote comes from a Facebook post, ask the member before putting their name on the site."
        fields:
          - { name: heading, label: Heading, hint: "Not shown on the page yet. Kept for later." }
          - name: items
            label: Quotes
            widget: list
            summary: "{{fields.who}}"
            hint: "Three fit the row neatly."
            fields:
              - { name: quote, label: The quote, widget: text, hint: "Their words, exactly. No quote marks needed, the page adds them." }
              - { name: who, label: Who said it }
              - { name: role, label: Their role or the date, required: false, hint: "Optional. For example, DSC brand ambassador." }
              - { name: source, label: Where it was published, required: false, hint: "Optional. For example, National Catholic Register. Leave empty for a quote said straight to us." }
              - { name: url, label: Link to the source, required: false, hint: "Optional. Turns the publication name into a link." }
      - name: venues
        label: Venues on the homepage
        file: src/_data/venues.json
        media_folder: /src/images/venues
        public_folder: /images/venues
        description: "The band of places that host our nights. A name is enough. Add a logo only for the venues that have given you permission to use theirs."
        fields:
          - { name: heading, label: Heading }
          - { name: lede, label: Line under the heading, widget: text }
          - name: items
            label: Venues
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, hint: "Write it the way the venue writes it." }
              - { name: url, label: Link to the venue, required: false, hint: "Optional. The name becomes a link." }
              - { name: logo, label: Logo, widget: image, required: false, hint: "Optional. A wide logo on a plain background works best. The name is used when there is no logo." }
      - name: about
        label: About page
        file: src/_data/about.json
        fields:
          - { name: lede, label: Line under the heading, widget: text }
          - name: pillars
            label: The three pillars
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { name: heading, label: Heading }
              - { name: text, label: Paragraph, widget: text }
          - name: letter
            label: Christopher's letter
            widget: object
            fields:
              - { name: greeting, label: Greeting }
              - { name: body, label: Letter, widget: markdown, hint: Blank line between paragraphs. }
              - { name: closing, label: Closing line, widget: text, hint: "The email address is added automatically after 'send them our way'." }
              - { name: signoff, label: Sign-off }
              - { name: name, label: Name }
              - { name: role, label: Title }
          - { name: sideCaption, label: Photo caption beside the letter, widget: text }

  - name: involved
    label: Get involved pages
    description: "Every word on the four pages people land on when they want to work with DSC. The email address and phone number come from Site settings, so change them there once and they change everywhere."
    files:
      - name: getinvolved
        label: Get involved page
        file: src/_data/getinvolved.json
        fields:
          - { name: heading, label: Heading at the top }
          - { name: body, label: Paragraph under the heading, widget: text }
          - { name: button, label: Button under the paragraph, hint: "It sends people to the Volunteer page." }
          - name: ambassador
            label: Brand ambassador band
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: button, label: Button, hint: "It sends people to the Brand ambassador page." }
          - name: work
            label: Work with us card
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: button, label: Button, hint: "It opens a new email about hosting a DSC night at a venue." }
          - name: ambassadorCard
            label: Become a brand ambassador card
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: button, label: Button, hint: "It sends people to the Brand ambassador page." }
          - name: music
            label: Play our events card
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: button, label: Button, hint: "It sends people to the Live music page." }
          - name: sponsor
            label: Sponsor an event card, including underwriting
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: button, label: Button, hint: "It opens a new email to the DSC address, because there is no sponsor page yet." }
          - name: donate
            label: Donate card
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: button, label: Button, hint: "It sends people to the Donate page." }
          - name: social
            label: Tag us and post with us band
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: hashtag, label: Hashtag, required: false, hint: "Optional. For example #dcsocialcollective. Leave it empty and no hashtag line shows." }
              - { name: button, label: First button, hint: "It goes to the Instagram link in Site settings." }
              - { name: collabButton, label: Second button, hint: "It opens a new email about planning a post together." }
          - name: contact
            label: Contact us block
            widget: object
            fields:
              - { name: heading, label: Heading }
              - { name: body, label: Paragraph, widget: text }
              - { name: place, label: Place }
      - name: volunteer
        label: Volunteer page
        file: src/_data/volunteer.json
        fields:
          - { name: heading, label: Heading at the top }
          - { name: subheading, label: Line under the heading, widget: text }
          - { name: body, label: Paragraph above the form, widget: text }
          - { name: formHeading, label: Heading above the form }
          - { name: helpLabel, label: Label on the last question }
          - name: options
            label: Answers people can pick from
            widget: list
            field: { name: option, label: Answer, widget: string }
            hint: "One line each. They show up in the drop-down in this order."
          - { name: button, label: Send button }
      - name: ambassador
        label: Brand ambassador page
        file: src/_data/ambassador.json
        fields:
          - { name: eyebrow, label: Small line above the heading }
          - { name: heading, label: Heading }
          - { name: intro, label: First paragraph, widget: text }
          - { name: intro2, label: Second paragraph, widget: text }
          - { name: lookingHeading, label: Heading above the list }
          - { name: listHeading, label: Line above the list }
          - name: list
            label: You might be her if
            widget: list
            field: { name: item, label: Line, widget: string }
            hint: "One line each."
          - { name: perksHeading, label: Heading above the perks }
          - name: perks
            label: Perks
            widget: list
            field: { name: item, label: Perk, widget: string }
            hint: "One line each."
          - { name: accepting, label: Accepting applications, widget: boolean, default: true, hint: "On shows the application form. Off hides it and shows the closed message below instead." }
          - { name: formHeading, label: Heading above the form }
          - { name: button, label: Send button }
          - { name: closedHeading, label: Heading when applications are closed }
          - { name: closedBody, label: Message when applications are closed, widget: text }
      - name: livemusic
        label: Live music page
        file: src/_data/livemusic.json
        fields:
          - { name: heading, label: Heading at the top }
          - { name: subheading, label: Line under the heading, widget: text }
          - { name: body, label: Paragraph above the form, widget: text }
          - { name: formHeading, label: Heading above the form }
          - { name: button, label: Send button }

  - name: press
    label: Press
    description: "Articles written about DSC. The newest three also show up on the homepage, so add a new one at the top of the list."
    files:
      - name: press
        label: Press page
        file: src/_data/press.json
        fields:
          - { name: heading, label: Heading at the top }
          - { name: lede, label: Paragraph under the heading, widget: text }
          - { name: sectionHeading, label: Heading above the articles }
          - { name: sectionLede, label: Line under that heading, widget: text }
          - { name: homeHeading, label: Heading on the homepage band }
          - { name: homeLink, label: Link on the homepage band, hint: "It sends people to this page." }
          - name: items
            label: Articles
            widget: list
            summary: "{{fields.publication}} · {{fields.title}}"
            hint: "Newest at the top. The first three are the ones on the homepage."
            fields:
              - { name: title, label: Headline, hint: "Copy the headline the way the article writes it." }
              - { name: publication, label: Publication, hint: "For example, National Catholic Register." }
              - { name: date, label: Date published, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false, hint: "Optional. Leave it empty and no date is shown." }
              - { name: url, label: Link to the article }
              - { name: image, label: Preview photo, widget: image, required: false, hint: "Optional. The photo shown beside the headline. A wide shot works best. Leave it empty and only the words show." }
              - { name: byline, label: Written by, required: false, hint: "Optional." }
              - { name: summary, label: One line about the article, widget: text, required: false, hint: "Optional. Your own words, not a quote from the article." }
          - { name: contactHeading, label: Heading on the press inquiries block }
          - { name: contactBody, label: Paragraph on the press inquiries block, widget: text }
          - { name: pressStripHeading, label: Line above the list of publications, hint: "The publications are pulled from the articles above, so the list is never out of date." }
          - { name: contactName, label: Second contact name, required: false, hint: "Optional. A person reporters can write to directly." }
          - { name: contactRole, label: Second contact role, required: false, hint: "Optional. For example, reporter, for anything editorial." }
          - { name: contactEmail, label: Second contact email, required: false, hint: "Optional. Leave empty and this line disappears." }

  - name: people
    label: Team and videos
    files:
      - name: team
        label: Team
        file: src/_data/team.json
        media_folder: /src/images/team
        public_folder: /images/team
        fields:
          - name: items
            label: Team members
            widget: list
            root: true
            summary: "{{fields.name}} · {{fields.role}}"
            fields:
              - { name: name, label: Name }
              - { name: role, label: Role }
              - { name: photo, label: Photo, widget: image }
              - { name: bio, label: Bio, widget: text }
      - name: videos
        label: Videos
        file: src/_data/videos.json
        description: "Each video needs two files uploaded to the video folder by Andrew: slug.mp4 and slug.jpg (the poster frame)."
        fields:
          - name: items
            label: Videos
            widget: list
            root: true
            summary: "{{fields.title}} · {{fields.where}}"
            fields:
              - { name: slug, label: File name (without .mp4) }
              - { name: title, label: Title }
              - { name: where, label: Venue and date }
              - { name: credit, label: Video credit, required: false }
              - { name: event, label: Event slug it belongs to, required: false }

  - name: settings
    label: Settings
    files:
      - name: site
        label: Site settings
        file: src/_data/site.json
        fields:
          - { name: name, label: Organization name }
          - { name: short, label: Short name }
          - { name: tagline, label: Tagline, widget: text }
          - { name: email, label: Email, hint: "Every form on the site sends to this address, and every email link on the site uses it." }
          - { name: phone, label: Phone }
          - { name: instagram, label: Instagram link }
          - { name: facebook, label: Facebook group link }
          - { name: merch, label: Merch store link }
          - { name: members, label: Member count as shown (e.g. 4,000) }
          - { name: url, widget: hidden }
          - { name: setupMode, widget: hidden }
