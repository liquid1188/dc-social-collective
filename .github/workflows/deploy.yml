# Cloudflare Pages builds and deploys the site itself on every push to main,
# so this workflow only covers the one thing it cannot do on its own: a daily
# rebuild, which is what retires the early bird line once its date passes.
#
# Set CLOUDFLARE_DEPLOY_HOOK in the repository secrets to the deploy hook URL
# from the Pages project (Settings, Builds and deployments, Deploy hooks).
name: Daily rebuild
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudflare Pages for a fresh build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not set, nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
