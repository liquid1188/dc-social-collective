# Opens a draft event in the editor when a new event appears in RSVPify.
#
# Zapier calls this with a POST to
#   https://api.github.com/repos/liquid1188/dc-social-collective/dispatches
# and a body of
#   {"event_type":"rsvpify-event","client_payload":{"title":"...","date":"...", ...}}
# See docs/rsvpify-zap.md for the whole setup, including the token.
#
# The draft has no page on the site until the Draft switch is turned off in the
# editor, so nothing here can publish a half-finished night by itself.
name: Draft event from RSVPify

on:
  repository_dispatch:
    types: [rsvpify-event]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Event as JSON, for example {"title":"Sangria y Salsa","date":"2026-11-07"}'
        required: true

permissions:
  contents: write

concurrency:
  group: rsvpify-draft

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Write the draft from Zapier
        if: github.event_name == 'repository_dispatch'
        env:
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/rsvpify-draft.mjs

      - name: Write the draft from a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          EVENT_PAYLOAD: ${{ inputs.payload }}
        run: node scripts/rsvpify-draft.mjs

      - name: Commit the draft
        run: |
          if [ -z "$(git status --porcelain src/events)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi
          git config user.name "RSVPify draft bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/events
          git commit -m "Draft event from RSVPify"
          git push
